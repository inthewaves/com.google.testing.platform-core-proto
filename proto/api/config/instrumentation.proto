// Reconstructed from com.google.testing.platform:core-proto:0.0.9-alpha04.

syntax = "proto3";

package google.testing.platform.proto.api.config;

import "proto/api/core/regex_pattern.proto";

option java_package = "com.google.testing.platform.proto.api.config";
option java_outer_classname = "InstrumentationProto";

message InstrumentationFilter {
  repeated google.testing.platform.proto.api.core.RegexPattern instrumentation_class_filters = 1;
}

message Instrumentation {
  string app_package = 1;
  string test_package = 2;
  string test_runner_class = 3;
  InstrumentationFilter instrumentation_filter = 4;
}

message InstrumentationArgs {
  bool enable_debug = 1;
  bool no_window_animation = 3;
  bool use_test_storage_service = 4;
  repeated string additional_args = 5;
  map<string, string> args_map = 2;
}
