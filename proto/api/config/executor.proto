// Reconstructed from com.google.testing.platform:core-proto:0.0.9-alpha04.

syntax = "proto3";

package google.testing.platform.proto.api.config;

import "proto/api/config/execution.proto";
import "proto/api/config/sharding_config.proto";

option java_package = "com.google.testing.platform.proto.api.config";
option java_outer_classname = "ExecutorProto";

message SingleDeviceExecutor {
  DeviceExecution device_execution = 1;
  ShardingConfig sharding_config = 2;
}

message MultiDeviceExecutor {
  DeviceExecution primary_device_execution = 1;
  repeated DeviceExecution companion_device_execution = 2;
}

message ParallelSingleDeviceExecutor {
  repeated DeviceExecution device_execution = 1;
}

message ParallelMultiDeviceExecutor {
  repeated MultiDeviceExecutor multi_device_executor = 1;
}

message ParallelDeviceExecutor {
  ShardCount shard_count = 1;
  oneof parallel_device_execution {
    ParallelSingleDeviceExecutor parallel_single_device_executor = 2;
    ParallelMultiDeviceExecutor parallel_multi_device_executor = 3;
  }
}

message ShardCount {
  int32 number_of_shards = 1;
}
