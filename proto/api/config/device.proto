// Reconstructed from com.google.testing.platform:core-proto:0.0.9-alpha04.

syntax = "proto3";

package google.testing.platform.proto.api.config;

import "proto/api/core/extension.proto";

option java_package = "com.google.testing.platform.proto.api.config";
option java_outer_classname = "DeviceProto";

message Device {
  DeviceId device_id = 1;
  google.testing.platform.proto.api.core.Extension provider = 3;
  int64 command_timeout_seconds = 4;
}

message DeviceId {
  string id = 1;
  string friendly_name = 2;
}

message DevicePorts {
  HostAndPort adb = 1;
  HostAndPort adb_server = 2;
  HostAndPort telnet = 3;
  HostAndPort grpc = 4;
  HostAndPort gnss_grpc = 5;
  HostAndPort netsim_grpc = 6;
}

message HostAndPort {
  string host = 1;
  int32 port = 2;
}
