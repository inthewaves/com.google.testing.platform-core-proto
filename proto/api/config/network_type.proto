syntax = "proto3";

package google.testing.platform.proto.api.config;

option java_package = "com.google.testing.platform.proto.api.config";
option java_outer_classname = "NetworkTypeProto";

enum NetworkType {
  UNKNOWN_NETWORK = 0;
  EDGE = 1;
  FASTNET = 2;
  GPRS = 3;
  GSM = 4;
  HSCSD = 5;
  HSDPA = 6;
  OFF = 7;
  UMTS = 8;
  LTE = 9;
  EVDO = 10;
}
