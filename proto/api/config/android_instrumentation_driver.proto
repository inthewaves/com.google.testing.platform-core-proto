syntax = "proto3";

package google.testing.platform.proto.api.config;

import "proto/api/config/runtime.proto";

option java_package = "com.google.testing.platform.proto.api.config";
option java_outer_classname = "AndroidInstrumentationDriverProto";

message AndroidInstrumentationDriver {
  enum ShellExecutionOption {
    UNSPECIFIED_SHELL_EXECUTION_OPTION = 0;
    NO_SHELL_EXECUTION = 1;
    STRICT_SHELL_EXECUTION = 2;
  }
  AndroidInstrumentationRuntime android_instrumentation_runtime = 1;
  int64 am_instrument_timeout = 2;
  bool use_orchestrator = 3;
  AndroidInstrumentationDriver.ShellExecutionOption shell_execution_option = 4;
  bool use_local_socket_shell_executor = 5;
}
