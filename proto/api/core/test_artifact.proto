// Reconstructed from com.google.testing.platform:core-proto:0.0.9-alpha04.

syntax = "proto3";

package google.testing.platform.proto.api.core;

import "google/protobuf/any.proto";
import "proto/api/core/label.proto";
import "proto/api/core/path.proto";

option java_package = "com.google.testing.platform.proto.api.core";
option java_outer_classname = "TestArtifactProto";
option objc_class_prefix = "GTPPAC";

enum ArtifactType {
  ARTIFACT_TYPE_UNSPECIFIED = 0;
  EXECUTABLE = 1;
  ANDROID_APK = 2;
  TEST_DATA = 3;
  ANDROID_APP_BUNDLE = 4;
  ANDROID_APK_SET = 5;
  REMOTE_DATA = 6;
}

message Artifact {
  Label label = 1;
  Path source_path = 2;
  Path destination_path = 3;
  ArtifactType type = 4;
  string checksum = 5;
  string mime_type = 6;
  google.protobuf.Any handling = 7;
}

message ArtifactHandled {
  Artifact artifact = 1;
}
