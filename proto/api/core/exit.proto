// Reconstructed from com.google.testing.platform:core-proto:0.0.9-alpha04.

syntax = "proto3";

package google.testing.platform.proto.api.core;

option java_package = "com.google.testing.platform.proto.api.core";
option java_outer_classname = "ExitProto";

message Exit {
  enum Code {
    OK = 0;
    FAIL = 1;
    INFRA_FAIL = 2;
    ABORTED_UNIX_SIGHUP = 129;
    ABORTED_UNIX_SIGINT = 130;
    ABORTED_UNIX_SIGQUIT = 131;
    ABORTED_UNIX_SIGILL = 132;
    ABORTED_UNIX_SIGTRAP = 133;
    ABORTED_UNIX_SIGABRT = 134;
    ABORTED_UNIX_SIGFPE = 136;
    ABORTED_UNIX_SIGKILL = 137;
    ABORTED_UNIX_SIGBUS = 138;
    ABORTED_UNIX_SIGSEGV = 139;
    ABORTED_UNIX_SIGPIPE = 141;
    ABORTED_UNIX_SIGTERM = 143;
  }
  Exit.Code code = 1;
  string cause = 2;
}
